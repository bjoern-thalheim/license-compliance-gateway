apiVersion: apps/v1
kind: Deployment
metadata:
  name: license-compliance-gateway
  labels:
    app.kubernetes.io/name: license-compliance-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: license-compliance-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: license-compliance-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: license-compliance-gateway:0.1.0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Der Service ist zustandslos; /tmp wird nur pro Request genutzt.
        - name: tmp
          emptyDir: {}
