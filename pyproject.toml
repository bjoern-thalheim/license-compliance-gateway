[project]
name = "license-compliance-gateway"
version = "0.1.0"
description = "Erzeugt aus einer CycloneDX-SBOM und Policy-Dateien ein auslieferbares Compliance-Paket."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12.5",
    "pydantic>=2.9.2",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "license-expression>=30.3.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "python-multipart>=0.0.12",
]

[project.scripts]
lcg = "lcg.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "httpx>=0.27.2",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcg"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "license_expression.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
